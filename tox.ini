[tox]
envlist =
    py3.10,py3.11,py3.12,py3.13,py3.14,pypy3.11,
    coverage,
    docs

[testenv]
deps =
    pytest
    pytest-cov
commands =
    python --version
    python -mpytest --cov \
        {posargs:}
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:coverage]
skip_install = true
basepython =
    python3.14
commands =
    coverage combine
    coverage report --fail-under=100 --show-missing
    coverage xml
deps =
    coverage
setenv =
    COVERAGE_FILE=.coverage
depends = py314

[testenv:docs]
basepython =
    python3.14
commands =
    sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
    sphinx-build -b doctest -d docs/_build/doctrees docs docs/_build/doctest
deps =
    Sphinx
    repoze.sphinx.autointerface
