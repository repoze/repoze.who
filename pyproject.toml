[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "repoze.who"
version = "3.2.0dev0"
description = "Identification and authentication framework for WSGI."
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
keywords = ["web", "application", "server", "wsgi", "zope"]
license-files = [
    "LICENSE.txt",
]
authors = [
  { name = "Tres Seaver, Agendaless Consulting", email = "tseaver@agendaless.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
  "WebOb",
  "zope.interface",
  "legacy-cgi; python_version > '3.12'",
]

[project.urls]
Repository = "https://github.com/repoze/repoze.who"
Issues = "https://github.com/repoze/repoze.who/issues"
Documentation = "https://repozewho.readthedocs.io/en/stable/index.html"
Changelog = "https://github.com/repoze/repoze.who/blob/master/CHANGES.rst"

[project.entry-points."paste.filter_app_factory"]
test = "repoze.who.middleware:make_test_middleware"
config = "repoze.who.config:make_middleware_with_config"
predicate = "repoze.who.restrict:make_predicate_restriction"
authenticated = "repoze.who.restrict:make_authenticated_restriction"

[dependency-groups]
dev = [
    "tox",
    "pytest",
    "pytest-cov",
    "ruff",
    "check-manifest",
    "build",
    "twine",
]
docs = [
    "sphinx",
]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
minversion = "6.0"
python_files = "test_*.py"
testpaths = [ "tests" ]

[tool.coverage.run]
omit = []

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
    "docs/",
]
target-version = "py314"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
]
ignore = [
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"
